<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Page HTML : Sylvain Malbon</title>
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Old Standard TT', serif;
      font-size: 22px;
      font-style: italic;
      background-color: #0a0a0a;
      color: #f2f2f2;
      margin: 40px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 50pt;
      font-style: normal;
      color: #00FF00; /* Vert Matrix */
      margin: 0;
    }

    h2 {
      font-style: normal;
      color: #f2f2f2;
      margin-bottom: 30px;
    }

    h3 {
      text-transform: uppercase;
      font-style: normal;
      font-size: 1.3em;
      color: #f2f2f2;
      margin-bottom: 10px;
    }

    ul {
      list-style-type: disc;
      padding-left: 20px;
      margin-top: 10px;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      border-left: 4px solid #00FF00; /* Vert Matrix */
      background-color: #1a1a1a;
    }

    .separator {
      font-size: 1.2em;
      color: #888;
    }

    .chat-gif {
      width: 120px;
      height: auto;
      transform: scaleX(-1); /* effet miroir horizontal */
    }

    @media screen and (max-width: 600px) {
      body {
        margin: 20px;
        font-size: 0.9em;
      }
      h1 {
        font-size: 36pt;
      }
      .chat-gif {
        width: 80px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Sylvain</h1>
    <img class="chat-gif" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYm9rbzk1eWVqejN5bTZqdHc3Yzh5cnJ6bnI4bThwc29mbGVzOHJwZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wwg1suUiTbCY8H8vIA/giphy.gif" alt="Chat Matrix">
  </div>

  <p>Concepteur EdTech</p>

  <section class="section">
    <h3>Qualités</h3>
    <ul>
      <li>Curieux</li>
      <li>Créatif</li>
      <li>Persévérant</li>
    </ul>
  </section>

  <section class="section">
    <h3>Formation <span class="separator">⇋</span> Parcours Pro</h3>
    <ul>
      <li>Langue & Civilisation Japonaises</li>
      <li>Enseignement du Français Langue Étrangère</li>
      <li>Création de Contenu & Communication Numériques</li>
      <li>Design Graphique</li>
      <li>Serveur & Barman</li>
    </ul>
  </section>

</body>
</html>
